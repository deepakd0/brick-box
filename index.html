<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BRICK BOX 12-in-1</title>
  <style>
    html,body{margin:0;min-height:100%;background:#1a1a1a;color:#ddd;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
    h1{margin:0 0 6px;font-weight:900;font-style:italic;font-size:44px;letter-spacing:.08em;color:#b3261e;text-shadow:1px 1px 0 rgba(255,255,255,.4);text-align:center}
    .sub{margin:0 0 30px;color:#9a9a9a;letter-spacing:.14em;font-size:14px;text-align:center}
    .cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
    a.card{display:block;box-sizing:border-box;width:280px;padding:30px 24px 26px;border-radius:34px;text-decoration:none;text-align:center;color:#4a3a05;
      background:linear-gradient(160deg,#f1d75a 0%,#e3bf33 55%,#cba51f 100%);
      box-shadow:inset 0 2px 3px rgba(255,255,255,.55),inset 0 -6px 10px rgba(110,80,0,.35),0 14px 30px rgba(0,0,0,.55);
      transition:transform .12s}
    a.card:hover,a.card:focus-visible{transform:translateY(-4px);outline:3px solid #fff}
    a.card .ico{display:block;margin:0 auto 14px;width:84px;height:84px;border-radius:14px;background:#2f322f;position:relative;box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
    a.card .ico i{position:absolute;background:#9ead86;border-radius:4px}
    a.card b{display:block;font-size:30px;font-style:italic;font-weight:900;letter-spacing:.08em}
    a.card span{display:block;margin-top:6px;font-size:14px;font-weight:bold;letter-spacing:.06em}
    a.card.pick{outline:4px solid #b3261e;transform:scale(1.04)}
    a.card .tag{display:none;margin-top:12px;font-size:11px;letter-spacing:.14em;color:#b3261e}
    a.card.pick .tag{display:block}
    .foot{margin-top:34px;font-size:12px;color:#777;text-align:center}
  </style>
</head>
<body>
  <h1>BRICK BOX</h1>
  <p class="sub">12 GAMES IN 1 &middot; PICK YOUR VERSION</p>
  <div class="cards">
    <a class="card" id="laptop" href="laptop.html">
      <span class="ico"><i style="left:10px;top:12px;width:64px;height:40px"></i><i style="left:22px;top:58px;width:40px;height:10px;background:#6a6e6a"></i></span>
      <b>LAPTOP</b><span>Keyboard: arrows, Space, Enter</span><span class="tag">SUGGESTED FOR YOUR DEVICE</span>
    </a>
    <a class="card" id="phone" href="phone.html">
      <span class="ico"><i style="left:26px;top:8px;width:32px;height:44px"></i><i style="left:20px;top:58px;width:44px;height:10px;background:#c92a1c;border-radius:5px"></i></span>
      <b>PHONE</b><span>Touch buttons, works offline</span><span class="tag">SUGGESTED FOR YOUR DEVICE</span>
    </a>
  </div>
  <p class="foot">Your hi-scores are saved on this device.</p>
  <script>
    // On a touch screen the phone version is the better fit.
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      document.getElementById('phone').classList.add('pick');
    }
  </script>
</body>
</html>
