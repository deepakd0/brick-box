<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRICK BOX 12-in-1 - mockups</title>
<style>
html,body{margin:0;background:#1a1a1a;color:#ddd;font-family:Arial,Helvetica,sans-serif}
h1{margin:0;padding:28px 0 4px;text-align:center;font-size:20px;letter-spacing:.2em;color:#e3bf33}
.sub{text-align:center;font-size:13px;color:#888;margin-bottom:24px}
.top{display:flex;justify-content:center;align-items:flex-start;gap:30px;padding:0 20px}
h2{margin:40px 0 18px;text-align:center;font-size:15px;letter-spacing:.2em;color:#aaa}
.grid{display:grid;grid-template-columns:repeat(4,280px);gap:22px 20px;justify-content:center;padding-bottom:40px}
.card{background:#242424;border-radius:12px;padding:10px;box-sizing:border-box}
.card .lcd{display:flex;justify-content:center}
.card h3{margin:10px 4px 2px;font-size:15px;color:#fff}
.card h3 span{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#e3bf33;color:#222;font-size:13px;margin-right:8px}
.card p{margin:0 4px 4px;font-size:12px;color:#999}
</style></head>
<body>
<h1>BRICK BOX 12-in-1</h1>
<div class="sub">Look-and-feel mockup. Static frames, not playable yet.</div>
<div class="top"><div id="laptop"></div><div id="phone"></div></div>
<h2>THE 12 GAMES</h2>
<div class="grid" id="grid"></div>
<script src="frames.js"></script><script src="console.js"></script>
<script>
var A = window.FRAMES[0];
function opts(f, layout) { return {game: f.name, frame: f.frame, next: f.next, score: f.score, hiscore: 12800, speed: f.speed, level: f.level, layout: layout}; }
renderConsole(document.getElementById('laptop'), opts(A, 'laptop'));
// phone layout shown at full 390 width, but only its natural height here
renderConsole(document.getElementById('phone'), opts(A, 'phone'));
var grid = document.getElementById('grid');
window.FRAMES.forEach(function (f) {
  var card = document.createElement('div');
  card.className = 'card';
  var lcd = document.createElement('div');
  lcd.className = 'lcd';
  card.appendChild(lcd);
  var h = document.createElement('h3');
  var badge = document.createElement('span');
  badge.textContent = f.letter;
  h.appendChild(badge);
  h.appendChild(document.createTextNode(f.name));
  var p = document.createElement('p');
  p.textContent = f.desc;
  card.appendChild(h);
  card.appendChild(p);
  grid.appendChild(card);
  renderLCD(lcd, opts(f, 'laptop'), 13);
});
</script></body></html>
